<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#050810"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4f7cff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="40%" r="50%">
      <stop offset="0%"   stop-color="#4f7cff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4f7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="60%" r="45%">
      <stop offset="0%"   stop-color="#a855f7" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e2d45" stroke-width="0.5" opacity="0.4"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Top border accent -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#accent-grad)" opacity="0.6"/>

  <!-- Logo mark -->
  <g transform="translate(80, 80)">
    <rect width="48" height="48" rx="10" fill="#0d1528" stroke="#4f7cff" stroke-width="1" stroke-opacity="0.4"/>
    <path d="M12 12L24 24L12 36H18L24 30L30 36H36L24 24L36 12H30L24 18L18 12H12Z" fill="#4f7cff"/>
  </g>
  <text x="146" y="114" font-family="system-ui, sans-serif" font-size="28" font-weight="600" fill="#e8eaf0">renix</text>
  <text x="218" y="114" font-family="system-ui, sans-serif" font-size="28" font-weight="600" fill="#4f7cff">.dev</text>

  <!-- Main headline -->
  <text x="80" y="290" font-family="system-ui, sans-serif" font-size="72" font-weight="700" fill="#e8eaf0" letter-spacing="-2">We Build Software</text>
  <text x="80" y="380" font-family="system-ui, sans-serif" font-size="72" font-weight="700" letter-spacing="-2">
    <tspan fill="url(#accent-grad)">That Ships.</tspan>
  </text>

  <!-- Subheading -->
  <text x="80" y="450" font-family="system-ui, sans-serif" font-size="26" fill="#6b7a99" letter-spacing="0">
    Web Apps · AI Integrations · Mobile — Built for founders.
  </text>

  <!-- Bottom bar -->
  <rect x="0" y="570" width="1200" height="60" fill="#0a0f1e" opacity="0.8"/>
  <text x="80" y="608" font-family="monospace, sans-serif" font-size="18" fill="#2e3d56">hello@renix.dev</text>
  <text x="1120" y="608" font-family="monospace, sans-serif" font-size="18" fill="#2e3d56" text-anchor="end">renix.dev</text>

  <!-- Decorative dots -->
  <circle cx="1100" cy="200" r="120" fill="#4f7cff" opacity="0.04"/>
  <circle cx="1050" cy="350" r="80"  fill="#a855f7" opacity="0.05"/>
  <circle cx="950"  cy="150" r="6"   fill="#4f7cff" opacity="0.6"/>
  <circle cx="1080" cy="280" r="4"   fill="#a855f7" opacity="0.5"/>
  <circle cx="1000" cy="420" r="5"   fill="#00e5ff" opacity="0.4"/>
</svg>
